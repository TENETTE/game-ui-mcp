[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "game-ui-mcp"
version = "0.2.0"
description = "Local MCP server that lets an AI draw, animate and hand off game and app UI (panels, buttons, HUDs, menus) for Unity, Unreal, Godot and Roblox - no image generation model involved."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "pillow>=10.1",
    "numpy>=1.24",
    "uharfbuzz>=0.39",
    "python-bidi>=0.4.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
game-ui-mcp = "game_ui_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/game_ui_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

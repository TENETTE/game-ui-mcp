[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "game-ui-mcp"
version = "0.1.0"
description = "Local MCP server that lets an AI draw game UI assets (panels, buttons, icons, HUD) for Unity, Unreal and Roblox - no image generation model involved."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "pillow>=10.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
game-ui-mcp = "game_ui_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/game_ui_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

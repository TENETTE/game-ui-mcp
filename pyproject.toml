[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "game-ui-mcp"
version = "0.6.0"
description = "Local MCP server that lets an AI draw, animate and hand off game and app UI (panels, buttons, HUDs, menus) for Unity, Unreal, Godot and Roblox - no image generation model involved."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "game-ui", "ui-design", "unity", "godot", "roblox", "unreal", "svg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
]
dependencies = [
    "mcp>=1.2",
    "pillow>=10.1",
    "numpy>=1.24",
    "uharfbuzz>=0.39",
    "python-bidi>=0.4.2",
    "pyclipper>=1.3",
]

[project.urls]
Homepage = "https://github.com/TENETTE/game-ui-mcp"
Issues = "https://github.com/TENETTE/game-ui-mcp/issues"

[project.optional-dependencies]
# pip install "game-ui-mcp[gpu]": shader fills and big blurs on an NVIDIA GPU (CUDA 12); falls back to the CPU
gpu = ["cupy-cuda12x[ctk]>=13.4"]
cpu = []
dev = ["pytest>=7"]

[project.scripts]
game-ui-mcp = "game_ui_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/game_ui_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

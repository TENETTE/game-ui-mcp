name: Feature request
description: A tool, style or export the model needs to draw something it cannot today
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What do you want to make?
      description: The UI piece, look or engine hand-off you are after (a reference image helps).
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: What is missing today?
      description: What you tried with the existing tools and where it falls short.
